  <script src="image-atlas-flat.js"></script>
  <script>
    function fillMosaic(containerId, images) {
      const container = document.getElementById(containerId);
      images.forEach(src => {
        const div = document.createElement('div');
        div.className = 'mosaic-img';
        const img = document.createElement('img');
        img.src = src;
        img.alt = '';
        img.loading = 'lazy';
        div.appendChild(img);
        container.appendChild(div);
      });
    }

    fillMosaic('mosaic-glutes', ATLAS_FLAT.glutes || []);
    fillMosaic('mosaic-legs',   ATLAS_FLAT.legs   || []);
    fillMosaic('mosaic-feet',   ATLAS_FLAT.feet   || []);
  </script>
